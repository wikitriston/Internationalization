<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-labelledby="bannerTitle bannerDesc">
  <title id="bannerTitle">Internationalization (I18n) — Modern Localization Framework for MediaWiki &amp; Scribunto Lua</title>
  <desc id="bannerDesc">Stable release v1.0.0 of WikiTriston Internationalization: stateless datastore, layered language fallbacks, Commons JsonConfig (.tab) support, and DRY ISO 3166 &amp; ISO 639 registries, powered by MediaWiki.</desc>

  <defs>
    <!-- Main Canvas Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060B16"/>
      <stop offset="50%" stop-color="#0B1324"/>
      <stop offset="100%" stop-color="#080D1A"/>
    </linearGradient>

    <!-- Ambient Glows -->
    <radialGradient id="glowCyan" cx="22%" cy="24%" r="48%">
      <stop offset="0%" stop-color="#0EA5E9" stop-opacity="0.22"/>
      <stop offset="55%" stop-color="#0284C7" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#060B16" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowIndigo" cx="82%" cy="52%" r="46%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.22"/>
      <stop offset="60%" stop-color="#4F46E5" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#060B16" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowEmerald" cx="16%" cy="84%" r="36%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#060B16" stop-opacity="0"/>
    </radialGradient>

    <!-- Typography & Brand Gradients -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="65%" stop-color="#F1F5F9"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>

    <linearGradient id="subtitleAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="52%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>

    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0EA5E9"/>
      <stop offset="50%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.45"/>
      <stop offset="50%" stop-color="#475569" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0.45"/>
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#090F1D" stop-opacity="0.96"/>
    </linearGradient>

    <linearGradient id="statGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.75"/>
    </linearGradient>

    <!-- Subtle Blueprint Grid Pattern -->
    <pattern id="gridPattern" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#94A3B8" stroke-width="0.6" stroke-opacity="0.08"/>
    </pattern>

    <!-- Outer Clip for Crisp 2:1 Rounded Frame -->
    <clipPath id="canvasClip">
      <rect x="0" y="0" width="1280" height="640" rx="20" ry="20"/>
    </clipPath>

    <clipPath id="codeCardClip">
      <rect x="708" y="76" width="504" height="480" rx="16" ry="16"/>
    </clipPath>
  </defs>

  <g clip-path="url(#canvasClip)">
    <!-- Base Layers -->
    <rect width="1280" height="640" fill="url(#bgGrad)"/>
    <rect width="1280" height="640" fill="url(#glowCyan)"/>
    <rect width="1280" height="640" fill="url(#glowIndigo)"/>
    <rect width="1280" height="640" fill="url(#glowEmerald)"/>
    <rect width="1280" height="640" fill="url(#gridPattern)"/>

    <!-- Decorative Global Meridian Arcs (Subtle i18n Motif) -->
    <g fill="none" stroke="#38BDF8" stroke-opacity="0.07" stroke-width="1.2">
      <circle cx="640" cy="320" r="430"/>
      <circle cx="640" cy="320" r="560"/>
      <ellipse cx="640" cy="320" rx="250" ry="430"/>
      <line x1="0" y1="320" x2="1280" y2="320" stroke-dasharray="4 8"/>
    </g>

    <!-- Top MediaWiki Tricolor Accent Hairline -->
    <rect x="68" y="0" width="140" height="3" fill="#0EA5E9" opacity="0.9"/>
    <rect x="208" y="0" width="140" height="3" fill="#10B981" opacity="0.9"/>
    <rect x="348" y="0" width="140" height="3" fill="#6366F1" opacity="0.9"/>

    <!-- ============================================================ -->
    <!-- LEFT COLUMN: BRANDING, BADGES, VALUE PROPOSITION & METRICS   -->
    <!-- ============================================================ -->

    <!-- Status Pill 1: STABLE RELEASE · v1.0.0 -->
    <g transform="translate(68, 76)">
      <rect width="232" height="34" rx="17" fill="#064E3B" fill-opacity="0.45" stroke="#10B981" stroke-opacity="0.55" stroke-width="1"/>
      <circle cx="20" cy="17" r="7" fill="#10B981" fill-opacity="0.25"/>
      <circle cx="20" cy="17" r="3.8" fill="#34D399"/>
      <text x="34" y="21.5" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" letter-spacing="0.7" fill="#A7F3D0">STABLE RELEASE · v1.0.0</text>
    </g>

    <!-- Status Pill 2: POWERED BY MEDIAWIKI -->
    <g transform="translate(312, 76)">
      <rect width="248" height="34" rx="17" fill="#0C4A6E" fill-opacity="0.45" stroke="#38BDF8" stroke-opacity="0.5" stroke-width="1"/>
      <!-- MediaWiki [[ ]] Wikitext Bracket Emblem -->
      <text x="16" y="21.5" font-family="'JetBrains Mono', 'Fira Code', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="800" fill="#38BDF8">[[]]</text>
      <text x="52" y="21.5" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" letter-spacing="0.7" fill="#BAE6FD">POWERED BY MEDIAWIKI</text>
    </g>

    <!-- Brand Emblem + Module Identity -->
    <g transform="translate(68, 142)">
      <!-- Rounded Icon Tile -->
      <rect width="54" height="54" rx="14" fill="url(#logoGrad)"/>
      <rect x="0.75" y="0.75" width="52.5" height="52.5" rx="13.25" fill="none" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="1.5"/>
      <!-- Stylized Globe Icon inside Tile -->
      <g transform="translate(27, 27)" fill="none" stroke="#FFFFFF" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="0" cy="0" r="14"/>
        <ellipse cx="0" cy="0" rx="6.5" ry="14"/>
        <line x1="-13.5" y1="-4.5" x2="13.5" y2="-4.5"/>
        <line x1="-13.5" y1="4.5" x2="13.5" y2="4.5"/>
      </g>

      <!-- Overline & Namespace -->
      <text x="70" y="22" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.8" fill="#38BDF8">WIKITRISTON  ·  MODULE:I18N</text>
      <text x="70" y="43" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="500" fill="#94A3B8">Scribunto Lua Localization Architecture</text>
    </g>

    <!-- Hero Title & Gradient Tagline -->
    <text x="68" y="258" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="54" font-weight="800" letter-spacing="-1.2" fill="url(#titleGrad)">Internationalization</text>
    <text x="68" y="304" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="25" font-weight="600" letter-spacing="-0.3" fill="url(#subtitleAccent)">Unified i18n Engine &amp; ISO Registry Suite</text>

    <!-- Value Proposition Copy -->
    <text x="68" y="352" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#94A3B8">Stateless message datastore with layered language fallbacks,</text>
    <text x="68" y="378" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#94A3B8">Commons JsonConfig (.tab) loading &amp; DRY ISO 3166 / 639 lookups.</text>

    <!-- Capability Micro-Pills -->
    <g transform="translate(68, 404)" font-family="'JetBrains Mono', 'Fira Code', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="600">
      <rect x="0" y="0" width="118" height="26" rx="6" fill="#1E293B" fill-opacity="0.7" stroke="#334155" stroke-width="1"/>
      <text x="59" y="17" text-anchor="middle" fill="#CBD5E1">mw.loadData</text>

      <rect x="128" y="0" width="128" height="26" rx="6" fill="#1E293B" fill-opacity="0.7" stroke="#334155" stroke-width="1"/>
      <text x="192" y="17" text-anchor="middle" fill="#CBD5E1">mw.ext.data</text>

      <rect x="266" y="0" width="112" height="26" rx="6" fill="#1E293B" fill-opacity="0.7" stroke="#334155" stroke-width="1"/>
      <text x="322" y="17" text-anchor="middle" fill="#CBD5E1">qqx Debug</text>

      <rect x="388" y="0" width="136" height="26" rx="6" fill="#1E293B" fill-opacity="0.7" stroke="#334155" stroke-width="1"/>
      <text x="456" y="17" text-anchor="middle" fill="#CBD5E1">#invoke Ready</text>
    </g>

    <!-- Bottom 4 Metric Cards (x=68..668, total width 600px) -->
    <g transform="translate(68, 464)">
      <!-- Stat 1 -->
      <rect x="0" y="0" width="141" height="92" rx="12" fill="url(#statGrad)" stroke="#334155" stroke-opacity="0.65" stroke-width="1"/>
      <text x="18" y="40" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="800" fill="#F8FAFC">Lua 5.1</text>
      <text x="18" y="66" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#94A3B8">Scribunto Core</text>

      <!-- Stat 2 -->
      <rect x="153" y="0" width="141" height="92" rx="12" fill="url(#statGrad)" stroke="#334155" stroke-opacity="0.65" stroke-width="1"/>
      <text x="171" y="40" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="800" fill="#38BDF8">255</text>
      <text x="171" y="66" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#94A3B8">ISO 3166 Codes</text>

      <!-- Stat 3 -->
      <rect x="306" y="0" width="141" height="92" rx="12" fill="url(#statGrad)" stroke="#334155" stroke-opacity="0.65" stroke-width="1"/>
      <text x="324" y="40" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="800" fill="#818CF8">181</text>
      <text x="324" y="66" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#94A3B8">ISO 639 Locales</text>

      <!-- Stat 4 -->
      <rect x="459" y="0" width="141" height="92" rx="12" fill="url(#statGrad)" stroke="#334155" stroke-opacity="0.65" stroke-width="1"/>
      <text x="477" y="40" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="800" fill="#34D399">MIT</text>
      <text x="477" y="66" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#94A3B8">Open License</text>
    </g>

    <!-- ============================================================ -->
    <!-- RIGHT COLUMN: CODE & MULTILINGUAL RESOLUTION PREVIEW CARD    -->
    <!-- ============================================================ -->
    <g clip-path="url(#codeCardClip)">
      <!-- Card Surface -->
      <rect x="708" y="76" width="504" height="480" fill="url(#cardGrad)"/>

      <!-- Window Header Bar -->
      <rect x="708" y="76" width="504" height="44" fill="#0F172A"/>
      <circle cx="732" cy="98" r="5.5" fill="#EF4444" fill-opacity="0.85"/>
      <circle cx="750" cy="98" r="5.5" fill="#F59E0B" fill-opacity="0.85"/>
      <circle cx="768" cy="98" r="5.5" fill="#10B981" fill-opacity="0.85"/>

      <!-- File Tab -->
      <rect x="790" y="84" width="146" height="28" rx="7" fill="#1E293B" stroke="#334155" stroke-width="1"/>
      <text x="863" y="102" text-anchor="middle" font-family="'JetBrains Mono', 'Fira Code', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="600" fill="#E2E8F0">Module:I18n.lua</text>

      <!-- Runtime Pill -->
      <rect x="1102" y="86" width="92" height="24" rx="12" fill="#0C4A6E" fill-opacity="0.5" stroke="#0284C7" stroke-opacity="0.5" stroke-width="1"/>
      <text x="1148" y="102" text-anchor="middle" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#7DD3FC">Scribunto</text>

      <line x1="708" y1="120" x2="1212" y2="120" stroke="#1E293B" stroke-width="1.2"/>

      <!-- Code Lines -->
      <g font-family="'JetBrains Mono', 'Fira Code', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">
        <!-- Line Numbers -->
        <g fill="#475569" text-anchor="end">
          <text x="742" y="150">1</text>
          <text x="742" y="175">2</text>
          <text x="742" y="200">3</text>
          <text x="742" y="225">4</text>
          <text x="742" y="250">5</text>
          <text x="742" y="275">6</text>
          <text x="742" y="300">7</text>
        </g>

        <!-- Syntax Highlighted Lua -->
        <text x="758" y="150" fill="#E2E8F0"><tspan fill="#C084FC">local</tspan> i18n = <tspan fill="#38BDF8">require</tspan>(<tspan fill="#86EFAC">'Module:I18n'</tspan>)</text>
        <text x="758" y="175" fill="#E2E8F0"><tspan fill="#C084FC">local</tspan> msg  = i18n.<tspan fill="#38BDF8">getHelper</tspan>(<tspan fill="#86EFAC">'Infobox'</tspan>)</text>

        <text x="758" y="225" fill="#64748B">-- Stateless lookup &amp; layered fallbacks</text>
        <text x="758" y="250" fill="#E2E8F0"><tspan fill="#38BDF8">msg</tspan>(<tspan fill="#86EFAC">'greeting'</tspan>, { name = <tspan fill="#86EFAC">'MediaWiki'</tspan> })</text>
        <text x="758" y="275" fill="#E2E8F0">i18n.<tspan fill="#38BDF8">getCountryName</tspan>(<tspan fill="#86EFAC">'VN'</tspan>, { lang = <tspan fill="#86EFAC">'vi'</tspan> })</text>
        <text x="758" y="300" fill="#E2E8F0">i18n.<tspan fill="#38BDF8">getLanguageName</tspan>(<tspan fill="#86EFAC">'vie'</tspan>, { lang = <tspan fill="#86EFAC">'ja'</tspan> })</text>
      </g>

      <!-- Lower Resolution Panel -->
      <rect x="708" y="324" width="504" height="232" fill="#070C18"/>
      <line x1="708" y1="324" x2="1212" y2="324" stroke="#1E293B" stroke-width="1.2"/>

      <text x="730" y="350" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1.4" fill="#64748B">FALLBACK CHAIN &amp; ISO RESOLUTION</text>
      <text x="1190" y="350" text-anchor="end" font-family="'JetBrains Mono', 'Fira Code', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="700" fill="#34D399">● STATELESS</text>

      <!-- Output Row 1 -->
      <g transform="translate(728, 366)">
        <rect width="464" height="48" rx="10" fill="#0F172A" stroke="#1E293B" stroke-width="1"/>
        <rect x="12" y="12" width="76" height="24" rx="6" fill="#0C4A6E" fill-opacity="0.55"/>
        <text x="50" y="28" text-anchor="middle" font-family="'JetBrains Mono', 'Fira Code', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="700" fill="#38BDF8">vi → en</text>
        <text x="102" y="29" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="500" fill="#F1F5F9">"Xin chào, MediaWiki!"</text>
        <text x="448" y="28" text-anchor="end" font-family="'JetBrains Mono', 'Fira Code', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="600" fill="#64748B">$name</text>
      </g>

      <!-- Output Row 2 -->
      <g transform="translate(728, 424)">
        <rect width="464" height="48" rx="10" fill="#0F172A" stroke="#1E293B" stroke-width="1"/>
        <rect x="12" y="12" width="76" height="24" rx="6" fill="#312E81" fill-opacity="0.55"/>
        <text x="50" y="28" text-anchor="middle" font-family="'JetBrains Mono', 'Fira Code', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="700" fill="#A5B4FC">ISO 3166</text>
        <text x="102" y="29" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="500" fill="#F1F5F9">VN / 704  →  "Việt Nam"</text>
        <text x="448" y="28" text-anchor="end" font-family="'JetBrains Mono', 'Fira Code', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="600" fill="#64748B">Alpha-2/3</text>
      </g>

      <!-- Output Row 3 -->
      <g transform="translate(728, 482)">
        <rect width="464" height="48" rx="10" fill="#0F172A" stroke="#1E293B" stroke-width="1"/>
        <rect x="12" y="12" width="76" height="24" rx="6" fill="#064E3B" fill-opacity="0.55"/>
        <text x="50" y="28" text-anchor="middle" font-family="'JetBrains Mono', 'Fira Code', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="700" fill="#6EE7B7">ISO 639</text>
        <text x="102" y="29" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="500" fill="#F1F5F9">vie / vi  →  "ベトナム語"</text>
        <text x="448" y="28" text-anchor="end" font-family="'JetBrains Mono', 'Fira Code', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="600" fill="#64748B">975+ i18n</text>
      </g>
    </g>

    <!-- Crisp Card & Outer Canvas Borders -->
    <rect x="708" y="76" width="504" height="480" rx="16" ry="16" fill="none" stroke="url(#borderGrad)" stroke-width="1.2"/>
    <rect x="0.75" y="0.75" width="1278.5" height="638.5" rx="19.25" ry="19.25" fill="none" stroke="url(#borderGrad)" stroke-width="1.5"/>
  </g>
</svg>
